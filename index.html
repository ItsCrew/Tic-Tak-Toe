<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tik Tak Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="win-container hide">
      <p class="msg">Winner</p>
      <button class="new-btn">New Game</button>
    </div>

    <h1>Tik Tak Toe</h1>
    <header>
      <div class="player-names">
        <input
          type="text"
          id="player1"
          class="PlayerInput"
          placeholder="Player 1 name here"
        />
        <span id="vs"><img src="assets/versus.png" /></span>
        <input
          type="text"
          id="player2"
          class="PlayerInput"
          placeholder="Player 2 name here"
        />
      </div>

      <div class="StartButtonContainer">
        <button onclick="setPlayerNames()" class="StartButton">
          Start the Game!
        </button>
      </div>
    </header>

    <main>
      <div class="scoreboard">
        <span id="player1-display">Player 1</span> vs
        <span id="player2-display">Player 2</span>
      </div>

      <div id="current-player">Current player: Player 1</div>

      <div class="container">
        <div class="game">
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
        </div>
      </div>
      <button class="reset-btn">Reset Game</button>
    </main>

    <footer>ajwdpo</footer>
    <script src="app.js"></script>
  </body>
</html>
